        <style>
            body {
                margin: 0;

            h2 {
                font-size: clamp(2rem, 8vw, 4rem);

                font-family: "Doto", sans-serif;

                font-weight: 600;
                font-style: normal;

            }
        </style>
    </head>
    <body>
        <h1>Hello!</h1>
        <h2 id="date"></h2>

        <script>
            const dateElement = document.getElementById("date");
            const options = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "numeric",
                minute: "numeric",
                hour12: true,
            };

            function renderDate() {
                const now = new Date();
                dateElement.textContent = now.toLocaleDateString(undefined, options);
            }

            // Immediate render
            renderDate();

            // Update on every minute
            const now = new Date();
            setInterval(renderDate, 60000);
        </script>
    </body>
