name = "halal-stock-screener"
main = "src/index.js"
compatibility_date = "2024-01-01"
type = "javascript"

# Routes for the worker
#routes = [
#  { pattern = "api/*", zone_name = "stock.msar.me" }
#]

# Environment variables
[env.development]
vars = { DATA_PROVIDER = "local" }

[env.production]
name = "halal-stock-screener-prod"
vars = { DATA_PROVIDER = "finnhub" }

# Secrets (configure via `wrangler secret put FINNHUB_API_KEY --env production`)
# [env.production]
# vars = { FINNHUB_API_KEY = "your-api-key-here" }
